<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 시작하기</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a1a2e;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.header {
  width: 100%;
  background: linear-gradient(135deg, #16213e, #0f3460);
  padding: 10px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { color: #e94560; font-size: 1rem; font-weight: 700; }
.header .info { color: #a0aec0; font-size: 0.82rem; }

.viewer {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px;
  width: 100%;
}

.nav-btn {
  background: rgba(233,69,96,0.8);
  color: white;
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 1.3rem;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.nav-btn:hover { background: #e94560; transform: scale(1.1); }
.nav-btn:disabled { background: rgba(255,255,255,0.1); cursor: default; transform: none; }

/* A4 비율 페이지 */
.page-scene {
  perspective: 1200px;
  flex-shrink: 0;
}

.page-flip {
  transition: transform 0.5s ease;
  transform-style: preserve-3d;
}
.page-flip.anim-next { animation: animNext 0.5s ease; }
.page-flip.anim-prev { animation: animPrev 0.5s ease; }
@keyframes animNext {
  0%   { transform: rotateY(0deg) scale(1); }
  50%  { transform: rotateY(-15deg) scale(0.95); }
  100% { transform: rotateY(0deg) scale(1); }
}
@keyframes animPrev {
  0%   { transform: rotateY(0deg) scale(1); }
  50%  { transform: rotateY(15deg) scale(0.95); }
  100% { transform: rotateY(0deg) scale(1); }
}

.a4-page {
  background: white;
  border-radius: 3px;
  box-shadow: 0 10px 50px rgba(0,0,0,0.6), 3px 3px 0 rgba(0,0,0,0.2);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

/* 표지 */
.a4-page.is-cover {
  background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8%;
}
.cover-emoji { font-size: 4em; margin-bottom: 0.3em; }
.cover-title { font-size: 1.8em; font-weight: 900; color: white; line-height: 1.2; margin-bottom: 0.3em; }
.cover-title span { color: #e94560; }
.cover-sub { color: #a0aec0; font-size: 0.75em; margin-bottom: 1.5em; line-height: 1.6; }
.cover-badge { background: #e94560; color: white; padding: 0.4em 1em; border-radius: 20px; font-size: 0.65em; font-weight: 600; }

/* 헤더 띠 */
.pg-head {
  background: linear-gradient(90deg, #1a1a2e, #0f3460);
  color: white;
  padding: 0.4em 0.8em;
  font-size: 0.55em;
  font-weight: 600;
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
}
.pg-head em { color: #e94560; font-style: normal; margin-right: 0.5em; }

/* 본문 */
.pg-body {
  padding: 1em 1.2em;
  overflow: hidden;
  font-size: 0.72em;
  line-height: 1.65;
  color: #2d3748;
}
.pg-body h1 {
  font-size: 1.35em;
  font-weight: 800;
  color: #1a1a2e;
  border-bottom: 3px solid #e94560;
  padding-bottom: 0.3em;
  margin-bottom: 0.6em;
  line-height: 1.3;
}
.pg-body h2 {
  font-size: 1.05em;
  font-weight: 700;
  color: #0f3460;
  border-left: 3px solid #e94560;
  padding-left: 0.5em;
  margin: 0.7em 0 0.4em;
}
.pg-body h3 {
  font-size: 0.9em;
  font-weight: 600;
  color: #2d3748;
  margin: 0.5em 0 0.3em;
}
.pg-body p { margin-bottom: 0.45em; }
.pg-body ul, .pg-body ol { padding-left: 1.2em; margin: 0.3em 0 0.5em; }
.pg-body li { margin: 0.15em 0; }
.pg-body blockquote {
  border-left: 3px solid #e94560;
  padding: 0.4em 0.7em;
  background: #f7fafc;
  color: #4a5568;
  font-style: italic;
  margin: 0.5em 0;
  font-size: 0.92em;
}
.pg-body pre {
  background: #1a1a2e;
  color: #e2e8f0;
  padding: 0.6em 0.8em;
  border-radius: 4px;
  font-size: 0.8em;
  overflow: hidden;
  margin: 0.5em 0;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-all;
}
.pg-body code {
  background: #edf2f7;
  color: #e94560;
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.88em;
}
.pg-body pre code { background: none; color: inherit; padding: 0; font-size: 1em; }
.pg-body table { width: 100%; border-collapse: collapse; margin: 0.5em 0; font-size: 0.85em; }
.pg-body th { background: #1a1a2e; color: white; padding: 0.3em 0.5em; text-align: left; }
.pg-body td { padding: 0.25em 0.5em; border-bottom: 1px solid #e2e8f0; }
.pg-body tr:nth-child(even) td { background: #f7fafc; }
.pg-body strong { color: #1a1a2e; font-weight: 700; }
.pg-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 0.5em 0; }
.pg-body img { max-width: 100%; border-radius: 4px; }

/* 푸터 */
.pg-foot {
  padding: 0.3em 0.8em;
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #e2e8f0;
  font-size: 0.5em;
  color: #a0aec0;
  background: #fafafa;
}

/* 진행바 */
.progress {
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.1);
}
.progress-bar {
  height: 100%;
  background: #e94560;
  transition: width 0.3s;
}

@media (max-width: 600px) {
  .viewer { padding: 10px 6px; gap: 6px; }
  .nav-btn { width: 36px; height: 36px; font-size: 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Claude Code 시작하기</h1>
  <div class="info">
    <span id="pgNum">1</span> / <span id="pgTotal">-</span>
  </div>
</div>

<div class="viewer">
  <button class="nav-btn" id="prevBtn" onclick="go(-1)" disabled>&#8592;</button>
  <div class="page-scene" id="scene">
    <div class="page-flip" id="flip">
      <div class="a4-page" id="page"></div>
    </div>
  </div>
  <button class="nav-btn" id="nextBtn" onclick="go(1)">&#8594;</button>
</div>

<div class="progress">
  <div class="progress-bar" id="bar"></div>
</div>

<script>
const CHAPTERS = ["# 챕터 1: Claude Code란 무엇인가\n> AI 페어 프로그래머의 등장과 개발 패러다임의 전환\n\n## 학습 목표\n- AI 코딩 도구의 발전 역사와 Claude Code의 위치를 이해한다\n- Claude Code가 기존 도구들과 어떻게 다른지 파악한다\n- 에이전트 기반 개발의 핵심 개념을 익힌다\n- 이 책의 학습 로드맵을 확인하고 학습 계획을 세운다\n\n---\n\n## 1.1 AI 코딩 도구의 역사와 Claude Code의 위치\n\n소프트웨어 개발에서 자동화의 꿈은 컴퓨터가 등장하던 시기부터 있었습니다. 코드를 작성하는 일 자체를 자동화할 수 있다면 얼마나 좋을까? 이 꿈은 수십 년에 걸쳐 조금씩 현실에 가까워지고 있습니다.\n\n### AI 코딩 도구의 진화\n\n```\nAI 코딩 도구의 세대별 진화:\n\n1세대 (2000년대): 코드 완성(Code Completion)\n  → IntelliSense, 자동 완성\n  → 규칙 기반, 문법 패턴 매칭\n  → 한계: 단순 자동 완성, 컨텍스트 이해 없음\n\n2세대 (2021-2022): AI 기반 코드 제안\n  → GitHub Copilot (2021)\n  → Tabnine, Kite\n  → 특징: LLM 기반, 라인 단위 예측\n  → 한계: 제안만 함, 실행/검증 불가\n\n3세대 (2023-현재): 에이전트 기반 AI\n  → Claude Code, Cursor, Aider\n  → 특징: 자율적으로 파일 읽기, 수정, 실행\n  → 혁신: 개발 워크플로우 전체 자동화\n```\n\nClaude Code는 3세대 에이전트 기반 AI 코딩 도구입니다. Anthropic이 2024년에 출시한 이 도구는 터미널에서 직접 실행되며, 파일 시스템과 상호작용하고, 코드를 실행하고, 오류를 수정하는 일련의 작업을 자율적으로 수행합니다.\n\n### 에이전트(Agent)란?\n\n\"에이전트\"라는 용어가 낯설 수 있습니다. 간단히 말하면, **목표를 주면 스스로 계획하고 실행하는 AI**입니다.\n\n```\n일반 AI 챗봇:                에이전트 AI:\n─────────────────────         ─────────────────────\n사용자: \"로그인 함수 작성해줘\"  사용자: \"로그인 기능 만들어줘\"\nAI: [코드 텍스트 반환]         AI: [계획 수립]\n사용자: [직접 파일에 복붙]          → 기존 코드 읽기\n                                  → 인증 로직 작성\n                                  → 파일 저장\n                                  → 테스트 실행\n                                  → 에러 수정\n                                  → 완료 보고\n```\n\nClaude Code는 단순히 코드를 \"생성\"하는 것이 아니라 개발 작업 전체를 \"수행\"합니다.\n\n---\n\n## 1.2 Claude Code가 기존 도구와 다른 점 (Copilot, ChatGPT와 비교)\n\n세 도구를 비교해 보겠습니다. 각 도구는 서로 다른 문제를 해결하도록 설계되었습니다.\n\n### 비교표\n\n| 특성 | GitHub Copilot | ChatGPT | Claude Code |\n|------|---------------|---------|-------------|\n| 실행 방식 | IDE 플러그인 | 웹 브라우저/API | 터미널 CLI |\n| 파일 접근 | 현재 편집 파일만 | 없음 (붙여넣기만) | 프로젝트 전체 |\n| 코드 실행 | 불가 | 불가 (Code Interpreter 제외) | 가능 |\n| 자동 수정 | 불가 | 불가 | 가능 |\n| 맥락 이해 | 현재 파일 수준 | 대화 내 텍스트만 | 전체 코드베이스 |\n| 사용 방식 | 자동 완성 | 질문-답변 | 작업 위임 |\n\n### Copilot과의 차이점\n\nGitHub Copilot은 코드를 타이핑하는 동안 다음 줄을 예측합니다. 개발자가 운전석에 앉아있고, Copilot은 조수석에서 힌트를 줍니다.\n\nClaude Code는 다릅니다. 개발자가 목적지(목표)를 말하면, Claude Code가 경로를 계획하고 운전합니다. 물론 개발자는 언제든 개입할 수 있습니다.\n\n```bash\n# Copilot 방식\nfunction validateEmail(  # ← 여기서 자동완성 제안이 나타남\n# 개발자가 수락/거부 선택 후 직접 저장\n\n# Claude Code 방식\n\"이메일 유효성 검사 함수를 만들고 테스트까지 작성해줘\"\n# Claude Code가 파일 생성, 함수 작성, 테스트 실행, 오류 수정까지 자동\n```\n\n### ChatGPT와의 차이점\n\nChatGPT는 대화 속에서 코드를 생성하지만, 실제 파일에는 접근할 수 없습니다. 생성된 코드를 복사해서 직접 붙여넣어야 합니다.\n\nClaude Code는 직접 파일을 읽고 수정합니다. \"auth.js 파일의 버그를 수정해줘\"라고 하면, 파일을 읽고, 버그를 찾고, 수정하고, 테스트까지 실행합니다.\n\n> **💡 팁:** Claude Code, Copilot, ChatGPT는 서로 경쟁 관계가 아닙니다. 많은 개발자들이 세 도구를 상황에 맞게 병행 사용합니다. IDE에서 빠른 자동완성은 Copilot, 개념 설명이나 아이디어 탐색은 ChatGPT, 실제 개발 작업 자동화는 Claude Code처럼요.\n\n---\n\n## 1.3 Claude Code의 핵심 철학: 에이전트 기반 개발\n\nClaude Code를 만든 Anthropic의 접근 방식에는 몇 가지 핵심 철학이 담겨 있습니다.\n\n### 철학 1: 신뢰와 투명성\n\nClaude Code는 파일을 수정하기 전에 무엇을 할지 보여줍니다. 중요한 작업(파일 삭제, 외부 API 호출 등)은 사용자 확인을 요청합니다. \"일단 해버리기\"가 아니라 \"확인하고 진행하기\"입니다.\n\n```\n예시: 파일 삭제 요청 시\n\n사용자: \"임시 파일들을 정리해줘\"\n\nClaude Code:\n\"다음 파일들을 삭제하려고 합니다:\n - temp/debug.log (234KB)\n - temp/cache.json (12KB)\n - temp/test-output.txt (4KB)\n\n진행할까요? [Y/N]\"\n```\n\n### 철학 2: 인간-AI 협업\n\nClaude Code는 개발자를 대체하는 것이 아니라 보완합니다. 반복적이고 지루한 작업을 자동화하여 개발자가 더 창의적이고 전략적인 일에 집중할 수 있게 합니다.\n\n```\nAI가 잘하는 것:                 인간이 잘하는 것:\n────────────────────────         ────────────────────────\n반복적인 코드 작성               비즈니스 요구사항 이해\n패턴 인식 및 적용                창의적 문제 해결\n보일러플레이트 생성              아키텍처 결정\n문서 작성                        맥락적 판단\n테스트 케이스 생성               윤리적 고려사항\n코드 리뷰 초안                   팀 커뮤니케이션\n```\n\n### 철학 3: 컨텍스트가 전부다\n\nClaude Code의 품질은 제공하는 컨텍스트에 비례합니다. 막연한 지시보다 구체적인 맥락을 제공할수록 결과가 좋아집니다.\n\n```bash\n# 낮은 품질의 프롬프트\n\"API 만들어줘\"\n\n# 높은 품질의 프롬프트\n\"Node.js + Express로 사용자 관리 REST API를 만들어줘.\n 요구사항:\n - POST /users: 사용자 생성 (이름, 이메일, 비밀번호)\n - GET /users/:id: 사용자 조회\n - PATCH /users/:id: 사용자 수정\n - DELETE /users/:id: 사용자 삭제\n\n 기술 스택: TypeScript, PostgreSQL, bcrypt\n 코딩 스타일: CLAUDE.md 참고\n 테스트: Jest + supertest로 통합 테스트 포함\"\n```\n\n### 핵심 도구 체계\n\nClaude Code가 사용하는 도구 체계를 이해하면 더 효과적으로 활용할 수 있습니다:\n\n```\nClaude Code의 도구 체계:\n┌─────────────────────────────────────────────┐\n│                                             │\n│  파일 조작                                  │\n│  ├─ Read: 파일 읽기                         │\n│  ├─ Edit: 파일 수정 (부분)                  │\n│  └─ Write: 파일 생성/덮어쓰기               │\n│                                             │\n│  탐색                                       │\n│  ├─ Glob: 파일 패턴 검색                    │\n│  └─ Grep: 내용 패턴 검색                    │\n│                                             │\n│  실행                                       │\n│  └─ Bash: 터미널 명령 실행                  │\n│                                             │\n│  AI 확장                                    │\n│  └─ Agent: 서브에이전트 실행                │\n│                                             │\n└─────────────────────────────────────────────┘\n```\n\n---\n\n## 1.4 이 책을 읽는 방법과 학습 로드맵\n\n이 책은 Claude Code를 처음 접하는 분부터 고급 워크플로우를 구축하려는 분까지를 대상으로 합니다.\n\n### 독자별 추천 경로\n\n**완전 초보자 (CLI가 낯선 분):**\n1 → 2 → 3 → 4 → 5 → 16장 순서로 읽으세요.\n기초를 탄탄히 다지는 것이 중요합니다.\n\n**기본 사용자 (기존 도구 사용 경험 있음):**\n1 → 3 → 6 → 8 → 9장 순서로 읽고,\n나머지는 필요할 때 참조하세요.\n\n**고급 사용자 (자동화에 관심 있는 분):**\n9 → 10 → 11 → 15 → 16장을 집중적으로 읽으세요.\n\n### 학습 로드맵\n\n```\n파트 1: 시작하기 (챕터 1-3)\n  ↓ 설치부터 첫 세션까지\n\n파트 2: 핵심 기능 (챕터 4-7)\n  ↓ 도구 마스터하기\n\n파트 3: 고급 워크플로우 (챕터 8-11)\n  ↓ 자동화와 확장\n\n파트 4: 실전 프로젝트 (챕터 12-15)\n  ↓ 실제 개발 시나리오\n\n파트 5: 최적화와 미래 (챕터 16-18)\n  ↓ 전문가 수준으로 성장\n```\n\n> **💡 팁:** 각 챕터의 코드 예제는 직접 따라 해보세요. Claude Code는 \"사용하면서 배우는\" 도구입니다. 읽기만 해서는 절반도 이해할 수 없습니다.\n\n---\n\n## 핵심 요약\n\n1. Claude Code는 에이전트 기반 3세대 AI 코딩 도구입니다\n2. Copilot(자동완성)이나 ChatGPT(대화)와 달리, **실제 개발 작업을 자율적으로 수행**합니다\n3. 파일 읽기, 수정, 실행, 검증까지 개발 워크플로우 전체를 담당합니다\n4. **컨텍스트가 핵심**: 구체적인 요청일수록 더 좋은 결과가 나옵니다\n5. 인간-AI 협업 도구로, 개발자를 대체하는 것이 아니라 보완합니다\n\n## 다음 챕터 미리보기\n\n2장에서는 Claude Code를 실제로 설치하고 설정합니다. macOS, Linux, Windows WSL 각 환경의 설치 방법과 Anthropic API 키 발급부터 첫 실행까지 step-by-step으로 안내합니다.\n", "# 챕터 2: 설치와 환경 설정\n> Claude Code를 내 컴퓨터에 완벽하게 세팅하기\n\n## 학습 목표\n- Node.js 환경과 Anthropic API 키를 준비한다\n- 운영체제별 설치 방법을 익힌다\n- 첫 실행과 인증 설정을 완료한다\n- 터미널 환경을 최적화한다\n\n---\n\n## 2.1 사전 요구사항: Node.js, npm, Anthropic API 키 발급\n\nClaude Code 설치 전에 필요한 것들을 준비합니다.\n\n### Node.js 설치\n\nClaude Code는 Node.js 기반으로 작동합니다. 버전 18 이상이 필요합니다.\n\n```bash\n# 현재 버전 확인\nnode --version  # v18.0.0 이상이어야 함\nnpm --version   # v8.0.0 이상이어야 함\n```\n\n**Node.js 설치 방법:**\n\n```bash\n# macOS - Homebrew 사용\nbrew install node\n\n# Ubuntu/Debian\ncurl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -\nsudo apt-get install -y nodejs\n\n# Windows - 공식 사이트에서 설치\n# https://nodejs.org 에서 LTS 버전 다운로드\n\n# 또는 nvm(Node Version Manager) 사용 (권장)\ncurl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash\nnvm install 20\nnvm use 20\n```\n\n> **💡 팁:** 여러 Node.js 버전을 관리해야 한다면 nvm(macOS/Linux) 또는 nvm-windows를 사용하세요. 버전 충돌 문제를 깔끔하게 해결할 수 있습니다.\n\n### Anthropic API 키 발급\n\nClaude Code 사용을 위해 두 가지 방법 중 하나를 선택합니다:\n\n**방법 1: Anthropic API 키 (종량제)**\n\n```\n1. https://console.anthropic.com 접속\n2. 계정 생성 또는 로그인\n3. \"API Keys\" 메뉴 → \"Create Key\"\n4. 키 이름 입력 후 생성\n5. 키를 안전한 곳에 복사 저장\n   (다시 볼 수 없으니 주의!)\n\n형식: sk-ant-api03-xxxxxxxxxxxxxxxxxxxxx\n```\n\n**방법 2: Claude.ai Pro 구독 (월 정액)**\n\n```\n1. https://claude.ai 에서 Pro 플랜 구독\n2. Claude Code 설치 후 claude 명령 실행\n3. 브라우저 인증 플로우 자동 진행\n4. 별도 API 키 불필요\n```\n\n**비용 비교:**\n\n| 방법 | 비용 | 특징 |\n|------|------|------|\n| API 키 | 사용량 기반 | 팀/기업 사용, 정밀한 비용 제어 |\n| Pro 구독 | $20/월 | 개인 사용, 간편한 설정 |\n\n---\n\n## 2.2 운영체제별 설치 방법\n\n### macOS 설치\n\n```bash\n# npm으로 전역 설치\nnpm install -g @anthropic-ai/claude-code\n\n# 설치 확인\nclaude --version\n\n# 만약 권한 오류가 나면:\nsudo npm install -g @anthropic-ai/claude-code\n# 또는 npm 전역 설치 경로 변경 (권장)\nmkdir ~/.npm-global\nnpm config set prefix '~/.npm-global'\necho 'export PATH=~/.npm-global/bin:$PATH' >> ~/.zshrc\nsource ~/.zshrc\n```\n\n### Linux 설치\n\n```bash\n# Ubuntu/Debian\nnpm install -g @anthropic-ai/claude-code\n\n# 권한 문제 해결\nmkdir -p ~/.npm-global\nnpm config set prefix '~/.npm-global'\necho 'export PATH=$HOME/.npm-global/bin:$PATH' >> ~/.bashrc\nsource ~/.bashrc\n\nnpm install -g @anthropic-ai/claude-code\n\n# 설치 확인\nclaude --version\n```\n\n### Windows WSL2 설치\n\nWindows에서 Claude Code를 사용하려면 WSL2(Windows Subsystem for Linux)가 필요합니다.\n\n```powershell\n# PowerShell (관리자 권한)에서 WSL2 설치\nwsl --install\nwsl --set-default-version 2\n\n# Ubuntu 설치 (Microsoft Store 또는 명령어)\nwsl --install -d Ubuntu-22.04\n```\n\n```bash\n# WSL2 Ubuntu 터미널에서\n# Node.js 설치\ncurl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -\nsudo apt-get install -y nodejs\n\n# Claude Code 설치\nnpm install -g @anthropic-ai/claude-code\n\n# 설치 확인\nclaude --version\n```\n\n> **💡 팁:** Windows에서 WSL2는 필수입니다. PowerShell이나 CMD에서는 Claude Code가 동작하지 않습니다. WSL2 설치가 번거롭다면 Windows Terminal을 설치하고 Ubuntu 탭을 기본으로 설정하면 편리합니다.\n\n---\n\n## 2.3 첫 실행과 인증 설정\n\n### API 키로 인증\n\n```bash\n# 환경변수로 API 키 설정 (현재 세션)\nexport ANTHROPIC_API_KEY=\"sk-ant-api03-your-key-here\"\n\n# 영구 설정 (~/.zshrc 또는 ~/.bashrc)\necho 'export ANTHROPIC_API_KEY=\"sk-ant-api03-your-key-here\"' >> ~/.zshrc\nsource ~/.zshrc\n\n# Claude Code 실행\nclaude\n```\n\n### Claude.ai Pro로 인증\n\n```bash\n# 브라우저 인증 플로우 시작\nclaude\n\n# 자동으로 브라우저가 열리며 로그인 화면 표시\n# Claude.ai 계정으로 로그인 후 허용 버튼 클릭\n# 터미널로 자동 복귀\n```\n\n### 첫 실행 화면\n\n성공적으로 인증되면 다음과 같은 화면이 나타납니다:\n\n```\n╭─────────────────────────────────────────────╮\n│ ✻ Welcome to Claude Code!                   │\n│                                             │\n│   /help for help, /exit to quit            │\n│                                             │\n│ cwd: /Users/username/project               │\n╰─────────────────────────────────────────────╯\n\n>\n```\n\n### 설치 상태 확인\n\n```bash\n# 진단 명령어\nclaude doctor\n\n# 출력 예시:\n# ✓ Node.js version: v20.11.0\n# ✓ npm version: 10.2.4\n# ✓ Claude Code version: 1.x.x\n# ✓ API key: configured\n# ✓ Network: connected\n```\n\n---\n\n## 2.4 터미널 환경 최적화 및 Shell 설정\n\n### zsh 최적화 (macOS 기본)\n\n```bash\n# ~/.zshrc에 추가\n\n# Claude Code 단축 별칭\nalias cc=\"claude\"\nalias ccf=\"claude --dangerously-skip-permissions\"  # 자동 승인 (주의!)\n\n# 프로젝트별 빠른 실행\nfunction ccproject() {\n  cd \"$1\" && claude\n}\n\n# API 키 관리 (여러 키를 프로젝트별로)\nfunction set-claude-key() {\n  export ANTHROPIC_API_KEY=$(cat ~/.claude-keys/$1)\n  echo \"Claude API key set to: $1\"\n}\n```\n\n### bash 최적화 (Linux)\n\n```bash\n# ~/.bashrc에 추가\nexport ANTHROPIC_API_KEY=\"your-key-here\"\n\n# 히스토리 설정 (claude 명령 기록 보존)\nHISTSIZE=10000\nHISTFILESIZE=20000\nHISTCONTROL=ignoredups:erasedups\n```\n\n### Windows Terminal 설정\n\n```json\n// settings.json에 Claude Code용 프로필 추가\n{\n  \"profiles\": {\n    \"list\": [\n      {\n        \"name\": \"Claude Code\",\n        \"source\": \"Windows.Terminal.Wsl\",\n        \"startingDirectory\": \"//wsl$/Ubuntu/home/username\",\n        \"icon\": \"🤖\",\n        \"colorScheme\": \"One Half Dark\"\n      }\n    ]\n  }\n}\n```\n\n### 유용한 환경 설정\n\n```bash\n# .claude/settings.json (프로젝트별 설정)\n{\n  \"model\": \"claude-opus-4-5\",\n  \"permissions\": {\n    \"allow\": [\"Bash(git *)\", \"Bash(npm *)\", \"Bash(pytest *)\"],\n    \"deny\": [\"Bash(rm -rf *)\"]\n  }\n}\n```\n\n> **💡 팁:** API 키를 `.env` 파일에 저장하고 `direnv`를 사용하면 프로젝트 디렉토리에 들어갈 때 자동으로 키가 설정됩니다. 팀 프로젝트에서 서로 다른 API 키를 사용할 때 특히 유용합니다.\n\n---\n\n## 핵심 요약\n\n1. Claude Code는 **Node.js 18+ 환경**에서 npm으로 설치합니다\n2. 인증은 **API 키** 또는 **Claude.ai Pro 구독** 두 가지 방법으로 가능합니다\n3. Windows에서는 반드시 **WSL2** 환경이 필요합니다\n4. `claude doctor` 명령으로 설치 상태를 확인합니다\n5. Shell 설정 파일에 API 키와 별칭을 등록하면 편리합니다\n\n## 다음 챕터 미리보기\n\n3장에서는 실제로 Claude Code를 실행하고 첫 번째 작업을 수행합니다. \"Hello, Claude Code!\" 세션을 통해 자연어로 코드를 생성하고, REPL 모드와 일회성 실행의 차이를 이해합니다.\n", "# 챕터 3: 첫 번째 세션: Hello, Claude Code!\n> 실전 대화로 배우는 Claude Code의 기본 흐름\n\n## 학습 목표\n- claude 명령어로 세션을 시작하고 종료한다\n- 자연어로 코드 생성을 요청한다\n- REPL 모드와 일회성 실행의 차이를 이해한다\n- 세션 관리와 대화 기록을 다룬다\n\n---\n\n## 3.1 claude 명령어로 세션 시작하기\n\nClaude Code는 터미널에서 실행되는 대화형 도구입니다. 가장 기본적인 실행 방법부터 시작합니다.\n\n### 기본 실행\n\n```bash\n# 프로젝트 디렉토리로 이동\ncd ~/my-project\n\n# Claude Code 시작\nclaude\n```\n\nClaude Code는 **현재 디렉토리**를 작업 공간으로 인식합니다. 따라서 항상 프로젝트 루트 디렉토리에서 실행하는 것이 좋습니다.\n\n### 시작 화면 이해\n\n```\n╭─────────────────────────────────────────────────────────────╮\n│ ✻ Claude Code (v1.x.x)                                      │\n│                                                             │\n│   Type your request in natural language                    │\n│   /help for commands | /exit to quit                       │\n│                                                             │\n│ Working directory: /home/user/my-project                   │\n│ Model: claude-opus-4-5                                     │\n╰─────────────────────────────────────────────────────────────╯\n\n>\n```\n\n각 요소의 의미:\n- **Working directory**: Claude Code가 파일을 읽고 쓸 기본 경로\n- **Model**: 현재 사용 중인 AI 모델\n- **>**: 명령 입력 프롬프트\n\n### 슬래시 명령어\n\nClaude Code에는 특수 명령어들이 있습니다:\n\n| 명령어 | 설명 |\n|--------|------|\n| `/help` | 사용 가능한 명령어 목록 |\n| `/exit` 또는 `/quit` | 세션 종료 |\n| `/clear` | 대화 기록 초기화 |\n| `/compact` | 컨텍스트 압축 |\n| `/model` | 모델 변경 |\n| `/cost` | 현재 세션 비용 확인 |\n| `/doctor` | 환경 진단 |\n\n---\n\n## 3.2 자연어로 코드 생성 요청하기 (간단한 Python 스크립트 예제)\n\n이제 실제로 첫 번째 요청을 해봅니다.\n\n### 첫 번째 요청: 간단한 Python 스크립트\n\n```\n> 현재 날씨를 가져와서 출력하는 간단한 Python 스크립트를 만들어줘.\n  OpenWeatherMap API를 사용하고, 서울 날씨를 보여줘.\n  결과는 weather.py 파일로 저장해줘.\n```\n\nClaude Code의 응답:\n\n```\nweather.py 파일을 생성하겠습니다.\n\n[Write 도구 사용 중...]\n\nweather.py 파일을 생성했습니다. 다음 내용이 포함되어 있습니다:\n```\n\n생성된 파일:\n```python\n# weather.py\nimport requests\nimport os\n\ndef get_weather(city: str = \"Seoul\") -> dict:\n    \"\"\"\n    OpenWeatherMap API로 날씨 정보를 가져옵니다.\n\n    Args:\n        city: 도시 이름 (기본값: Seoul)\n\n    Returns:\n        날씨 정보 딕셔너리\n    \"\"\"\n    api_key = os.environ.get(\"OPENWEATHER_API_KEY\")\n    if not api_key:\n        raise ValueError(\"OPENWEATHER_API_KEY 환경변수가 설정되지 않았습니다\")\n\n    url = f\"https://api.openweathermap.org/data/2.5/weather\"\n    params = {\n        \"q\": city,\n        \"appid\": api_key,\n        \"units\": \"metric\",\n        \"lang\": \"kr\"\n    }\n\n    response = requests.get(url, params=params)\n    response.raise_for_status()\n    return response.json()\n\n\ndef display_weather(weather_data: dict) -> None:\n    \"\"\"날씨 정보를 사람이 읽기 쉬운 형태로 출력합니다.\"\"\"\n    city = weather_data[\"name\"]\n    temp = weather_data[\"main\"][\"temp\"]\n    feels_like = weather_data[\"main\"][\"feels_like\"]\n    description = weather_data[\"weather\"][0][\"description\"]\n    humidity = weather_data[\"main\"][\"humidity\"]\n    wind_speed = weather_data[\"wind\"][\"speed\"]\n\n    print(f\"🌍 {city} 현재 날씨\")\n    print(f\"{'─' * 30}\")\n    print(f\"🌡️  기온: {temp:.1f}°C (체감 {feels_like:.1f}°C)\")\n    print(f\"☁️  날씨: {description}\")\n    print(f\"💧 습도: {humidity}%\")\n    print(f\"💨 풍속: {wind_speed} m/s\")\n\n\nif __name__ == \"__main__\":\n    weather_data = get_weather(\"Seoul\")\n    display_weather(weather_data)\n```\n\n이어서 실행까지:\n\n```\n> 실행해줘. API 키는 환경변수에 이미 있어.\n```\n\n```\n[Bash 도구 사용 중...]\n$ python weather.py\n\n🌍 Seoul 현재 날씨\n──────────────────────────────\n🌡️  기온: 8.3°C (체감 5.1°C)\n☁️  날씨: 맑음\n💧 습도: 45%\n💨 풍속: 3.2 m/s\n\n실행이 완료되었습니다.\n```\n\n이것이 Claude Code의 기본 워크플로우입니다: **요청 → 파일 생성 → 실행 → 결과 확인**.\n\n### 요청 작성 팁\n\n```\n❌ 모호한 요청:\n\"파이썬 스크립트 만들어줘\"\n\n✅ 구체적인 요청:\n\"현재 디렉토리의 CSV 파일들을 읽어서\n 각 파일의 행 수, 열 수, 파일 크기를 표로 정리하고\n summary.txt로 저장하는 Python 스크립트를 만들어줘\"\n```\n\n---\n\n## 3.3 REPL 모드 vs 일회성 실행 (-p 플래그) 차이 이해\n\nClaude Code는 두 가지 실행 모드를 지원합니다.\n\n### REPL 모드 (기본)\n\n```bash\nclaude\n```\n\n대화형 인터페이스가 열리며 여러 번 주고받을 수 있습니다. 이전 대화 내용이 컨텍스트로 유지됩니다.\n\n```\n사용 시나리오:\n- 복잡한 개발 작업\n- 반복적인 수정과 피드백\n- 코드베이스 탐색\n- 디버깅 세션\n```\n\n### 일회성 실행 (-p 플래그)\n\n```bash\n# 단일 명령 실행 후 종료\nclaude -p \"package.json에서 버전 번호를 알려줘\"\n\n# 스크립트에서 활용\nVERSION=$(claude -p \"package.json의 version 필드 값만 출력해줘\")\necho \"현재 버전: $VERSION\"\n```\n\n```\n사용 시나리오:\n- 자동화 스크립트\n- CI/CD 파이프라인\n- 빠른 일회성 질문\n- 배치 처리\n```\n\n### 파이프 입력\n\n```bash\n# 파일 내용을 파이프로 전달\ncat error.log | claude -p \"이 에러 로그를 분석하고 원인을 설명해줘\"\n\n# git diff를 PR 설명으로 변환\ngit diff main | claude -p \"이 변경사항을 PR 설명으로 작성해줘 (한국어)\"\n\n# 코드 리뷰 자동화\ngit show HEAD | claude -p \"이 커밋을 코드 리뷰해줘. 문제점과 개선사항을 알려줘\"\n```\n\n### 출력 형식 제어\n\n```bash\n# JSON 형식으로 출력 (스크립트 파싱용)\nclaude -p \"package.json을 분석해서 의존성 목록을 JSON으로 반환해줘\" \\\n  --output-format json\n\n# 마크다운 없이 순수 텍스트\nclaude -p \"이 함수를 한 줄로 설명해줘\" --output-format text\n```\n\n> **💡 팁:** `-p` 플래그는 자동화에 매우 유용합니다. GitHub Actions에서 코드 리뷰, 릴리즈 노트 생성, 번역 작업 등을 자동화할 때 활용하세요. 15장에서 상세히 다룹니다.\n\n---\n\n## 3.4 세션 종료와 대화 기록 관리\n\n### 세션 종료\n\n```bash\n# 방법 1: 슬래시 명령어\n/exit\n\n# 방법 2: Ctrl+C (또는 Ctrl+D)\n\n# 방법 3: 자연어\n\"종료해줘\"\n```\n\n### 컨텍스트 초기화\n\n세션 중 대화가 너무 길어지거나 새로운 주제로 전환할 때:\n\n```bash\n# 대화 기록 완전 초기화 (새 세션 시작 효과)\n/clear\n\n# 컨텍스트 압축 (내용 유지하면서 토큰 절약)\n/compact\n```\n\n### 대화 기록 저장\n\n중요한 세션 내용을 저장하려면:\n\n```bash\n# 세션 중에 요청\n\"지금까지 논의한 내용을 session-notes.md로 저장해줘\"\n\n# 또는 터미널 출력 저장\nclaude | tee session-log.txt\n```\n\n### 세션 재개\n\nClaude Code는 기본적으로 세션 간 메모리를 유지하지 않습니다. 이전 세션의 컨텍스트가 필요하다면:\n\n1. `CLAUDE.md` 파일에 프로젝트 정보 기록 (8장 참조)\n2. 세션 시작 시 관련 파일을 다시 읽도록 요청\n3. 이전에 저장한 노트를 참조하도록 안내\n\n```bash\n# 새 세션 시작 시\nclaude\n> CLAUDE.md와 지난 번 작성한 session-notes.md를 읽고\n  우리가 어디까지 진행했는지 파악해줘\n```\n\n---\n\n## 핵심 요약\n\n1. `claude` 명령으로 현재 디렉토리를 작업 공간으로 하는 대화형 세션을 시작합니다\n2. 자연어로 구체적인 요청을 하면 파일 생성, 실행, 검증까지 자동으로 처리됩니다\n3. **REPL 모드**는 복잡한 개발 작업에, **-p 플래그**는 자동화와 일회성 작업에 사용합니다\n4. `/clear`와 `/compact`로 대화 컨텍스트를 관리합니다\n5. 세션 내용은 파일로 저장하여 다음 세션에서 참조할 수 있습니다\n\n## 다음 챕터 미리보기\n\n파트 2에서는 Claude Code의 핵심 도구들을 하나씩 마스터합니다. 4장에서는 Read 도구의 동작 원리와 대형 코드베이스를 효율적으로 탐색하는 전략을 배웁니다.\n", "# 챕터 4: 파일 읽기와 코드 이해\n> Claude Code가 내 코드베이스를 파악하는 방법\n\n## 학습 목표\n- Read 도구의 동작 원리를 이해하고 효과적으로 활용한다\n- 대형 코드베이스를 전략적으로 탐색하는 방법을 익힌다\n- 레거시 코드를 Claude Code와 함께 분석하는 패턴을 학습한다\n- 컨텍스트 한계를 관리하며 효율적으로 작업하는 기술을 습득한다\n\n---\n\n## 4.1 파일 읽기 도구(Read) 동작 원리와 활용법\n\nClaude Code가 코드를 이해하려면 먼저 코드를 읽어야 합니다. 이것은 당연한 말처럼 들리지만, AI 코딩 도구에서 \"읽는다\"는 행위가 어떻게 작동하는지 이해하는 것은 Claude Code를 효과적으로 사용하는 첫 번째 열쇠입니다.\n\n### Read 도구의 내부 구조\n\nClaude Code의 Read 도구는 파일의 내용을 토큰 스트림으로 변환하여 모델의 컨텍스트 윈도우에 주입합니다. 일반적인 파일 뷰어와 달리, Claude Code는 파일을 읽는 순간 그 내용을 **이해**하기 시작합니다.\n\n```\n사용자: \"src/auth/middleware.js 파일을 읽고 취약점을 분석해줘\"\n\n내부 처리 과정:\n┌─────────────────────────────────────────────────┐\n│  1. Read 도구 호출                               │\n│     → file_path: \"src/auth/middleware.js\"       │\n│     → offset: 0 (처음부터)                      │\n│     → limit: 2000 (기본값: 줄 수)               │\n│                                                 │\n│  2. 파일 내용 → 토큰 변환                        │\n│     → 코드 1,000줄 ≈ 약 5,000-8,000 토큰        │\n│                                                 │\n│  3. 컨텍스트 윈도우에 주입                       │\n│     → Claude가 내용 분석 시작                   │\n└─────────────────────────────────────────────────┘\n```\n\n### 기본 사용 패턴\n\nClaude Code에게 파일을 읽도록 요청하는 방법은 여러 가지입니다:\n\n```bash\n# 명시적 요청\n\"package.json을 읽어줘\"\n\"src/index.ts 파일의 내용을 보여줘\"\n\n# 분석 요청 (암시적 읽기)\n\"src/utils/parser.js에서 버그를 찾아줘\"\n\"config/database.yml 설정을 검토해줘\"\n\n# 범위 지정 읽기 (대용량 파일)\n\"app.py의 100번 줄부터 200번 줄까지 읽어줘\"\n```\n\n두 번째와 세 번째 패턴이 특히 중요합니다. 분석을 요청하면 Claude Code는 자동으로 파일을 읽고 분석을 수행합니다. 사용자가 \"읽어줘\"라고 명시할 필요가 없습니다.\n\n### 줄 번호와 오프셋 활용\n\n대용량 파일을 다룰 때는 특정 범위만 읽도록 지정할 수 있습니다:\n\n```bash\n# 대용량 파일의 특정 섹션 읽기\n\"database.py의 200번 줄부터 300번 줄 사이에 있는\n 쿼리 함수들을 분석해줘\"\n```\n\nClaude Code는 Read 도구의 `offset`과 `limit` 파라미터를 활용하여 필요한 부분만 읽습니다. 이는 50,000줄짜리 파일 전체를 컨텍스트에 올리는 비효율을 방지합니다.\n\n> **💡 팁:** 파일이 2,000줄을 넘는다면, Claude Code는 자동으로 중요한 부분을 분할하여 읽습니다. 하지만 명시적으로 \"~번 줄부터\"라고 지정하면 더 정확한 분석이 가능합니다.\n\n### 지원 파일 형식\n\nRead 도구는 텍스트 기반 파일이라면 거의 모든 형식을 지원합니다:\n\n| 카테고리 | 지원 형식 |\n|---------|---------|\n| 프로그래밍 언어 | .py, .js, .ts, .java, .go, .rs, .cpp, .c, .rb, .php |\n| 설정 파일 | .json, .yaml, .yml, .toml, .ini, .env |\n| 마크업 | .html, .css, .scss, .xml, .md, .mdx |\n| 쉘 스크립트 | .sh, .bash, .zsh, .fish |\n| 데이터 | .csv, .sql, .graphql |\n\n바이너리 파일(이미지, 실행 파일 등)은 직접 읽을 수 없지만, PDF는 텍스트 추출을 통해 분석이 가능합니다.\n\n---\n\n## 4.2 대형 코드베이스 탐색: 디렉토리 구조 파악 전략\n\n실제 프로젝트는 수백, 수천 개의 파일로 구성됩니다. 이런 코드베이스를 효율적으로 탐색하는 전략이 필요합니다.\n\n### 탑다운 탐색 전략\n\n처음 접하는 코드베이스는 항상 큰 그림부터 파악합니다:\n\n```\nStep 1: 루트 디렉토리 구조 파악\n────────────────────────────────\n\"이 프로젝트의 전체 디렉토리 구조를 보여줘.\n 주요 폴더와 파일의 역할을 설명해줘.\"\n\nClaude Code의 행동:\n- ls 또는 find 명령으로 구조 파악\n- package.json, requirements.txt 등 설정 파일 확인\n- README.md 읽기\n- 엔트리 포인트 파일 식별\n\nStep 2: 핵심 모듈 파악\n────────────────────────────────\n\"이 프로젝트에서 가장 중요한 파일 5개는 뭐야?\"\n\nStep 3: 특정 기능 추적\n────────────────────────────────\n\"사용자 인증 로직이 어디에 있어?\"\n```\n\n### 실전 예제: Node.js 프로젝트 탐색\n\n다음은 실제 팀 프로젝트를 처음 맡았을 때의 탐색 시나리오입니다:\n\n```\n프롬프트 순서:\n\n1. \"이 프로젝트의 package.json을 읽고 어떤 프로젝트인지 설명해줘\"\n\n2. \"src 폴더의 구조를 분석해서 아키텍처 패턴을 파악해줘\"\n\n3. \"API 라우트가 어디에 정의되어 있어? 전체 목록을 알고 싶어\"\n\n4. \"데이터베이스 연결 설정은 어디에 있어?\"\n\n5. \"테스트 파일들의 커버리지는 어때? 테스트 없는 주요 기능이 있어?\"\n```\n\n각 단계마다 Claude Code는 자동으로 관련 파일들을 읽고 종합적인 답변을 제공합니다.\n\n### 코드베이스 맵 생성\n\n새 프로젝트 온보딩 시 가장 유용한 기법은 \"코드베이스 맵\"을 만드는 것입니다:\n\n```bash\n\"이 프로젝트를 처음 보는 개발자를 위해\n 다음 내용을 포함한 코드베이스 지도를 만들어줘:\n 1. 전체 아키텍처 다이어그램 (텍스트)\n 2. 주요 모듈별 역할 설명\n 3. 데이터 흐름도\n 4. 외부 의존성 목록\n 5. 개발 시작 전 알아야 할 사항들\"\n```\n\n결과물은 `ARCHITECTURE.md`로 저장해두면 팀 전체가 활용할 수 있습니다.\n\n> **💡 팁:** `CLAUDE.md` 파일에 프로젝트의 핵심 파일 목록을 명시해두면, 매 세션마다 탐색하는 시간을 절약할 수 있습니다. 8장에서 자세히 다룹니다.\n\n---\n\n## 4.3 레거시 코드 분석 요청하기 (실전 예제: Express.js 앱)\n\n레거시 코드 분석은 Claude Code가 가장 빛을 발하는 영역 중 하나입니다. 문서가 없고, 작성자도 없고, 이해하기 어려운 코드를 분석할 때 강력한 파트너가 됩니다.\n\n### 분석 요청 패턴\n\n다음은 오래된 Express.js 앱을 분석하는 실전 예제입니다:\n\n```javascript\n// 분석 대상 코드 (레거시 app.js)\nvar express = require('express');\nvar app = express();\nvar mysql = require('mysql');\nvar session = require('express-session');\n\nvar db = mysql.createConnection({\n  host: 'localhost',\n  user: 'root',\n  password: '1234',\n  database: 'myapp'\n});\n\napp.use(session({secret: 'secret' // A4 비율에 맞게 페이지 크기 동적 계산
function sizePages() {
  const vw = window.innerWidth;
  const vh = window.innerHeight - 56 - 4; // header + progress
  const navW = 60;
  const gap = 16;
  const maxW = Math.min(vw - navW * 2 - gap * 2 - 40, 550);
  const maxH = vh - 40;
  // A4 = 1:1.414
  let w = maxW;
  let h = w * 1.414;
  if (h > maxH) { h = maxH; w = h / 1.414; }
  const page = document.getElementById('page');
  page.style.width = w + 'px';
  page.style.height = h + 'px';
  // 폰트 기준 크기
  page.style.fontSize = (w / 400 * 14) + 'px';
}

    // \n## 기준 분할
    const parts = md.split(/\n(?=##\s)/);
    parts.forEach(part => {
      if (part.trim()) pages.push({ type:'content', title, num: ci+1, md: part.trim() });
    });
  });
  return pages;
}

const PAGES = buildPages();
let cur = 0;
let busy = false;

document.getElementById('pgTotal').textContent = PAGES.length;

function render(p) {
  const el = document.getElementById('page');
  if (p.type === 'cover') {
    el.className = 'a4-page is-cover';
    el.innerHTML =
      '<div class="cover-emoji">🤖</div>' +
      '<div class="cover-title">Claude Code<br><span>시작하기</span></div>' +
      '<div class="cover-sub">AI 페어 프로그래머와 함께하는<br>개발의 미래</div>' +
      '<div class="cover-badge">Claude Code가 스스로 작성한 입문서</div>';
    return;
  }
  el.className = 'a4-page';
  const html = marked.parse(p.md);
  el.innerHTML =
    '<div class="pg-head"><em>CH' + p.num + '</em>' + p.title + '</div>' +
    '<div class="pg-body">' + html + '</div>' +
    '<div class="pg-foot"><span>Claude Code 시작하기</span><span>' + (cur+1) + '</span></div>';
}

function updateUI() {
  document.getElementById('pgNum').textContent = cur + 1;
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === PAGES.length - 1;
  document.getElementById('bar').style.width = ((cur+1)/PAGES.length*100) + '%';
}

function go(dir) {
  if (busy) return;
  const next = cur + dir;
  if (next < 0 || next >= PAGES.length) return;
  busy = true;
  const flip = document.getElementById('flip');
  flip.classList.add(dir > 0 ? 'anim-next' : 'anim-prev');
  setTimeout(() => {
    cur = next;
    render(PAGES[cur]);
    updateUI();
    flip.classList.remove('anim-next','anim-prev');
    busy = false;
  }, 250);
}

// 키보드
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') go(-1);
});

// 터치 스와이프
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  const d = tx - e.changedTouches[0].clientX;
  if (Math.abs(d) > 40) go(d > 0 ? 1 : -1);
}, {passive:true});

// 초기화
sizePages();
window.addEventListener('resize', sizePages);
render(PAGES[0]);
updateUI();
</script>
</body>
</html>
